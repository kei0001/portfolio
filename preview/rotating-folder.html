<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f4f4">
<meta name="description" content="Rotating three-dimensional ASCII folder — interactive motion study.">
<title>ASCII Folder / Motion Study — Portfolio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@300;400;500;600&family=Noto+Sans+JP:wght@400;500&display=swap');
:root{--paper:#f4f4f4;--ink:#141414;--grey:#777;--mono:'Geist Mono',monospace;--sans:'Geist','Noto Sans JP',sans-serif}
*{box-sizing:border-box}html,body{width:100%;min-height:100%;margin:0}html{scrollbar-width:none}html::-webkit-scrollbar{display:none}
body{background:var(--paper);color:var(--ink);font:400 14px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}a:hover{text-decoration:underline;text-underline-offset:4px}
a:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:5px}
button{font:inherit;border:0;background:transparent;color:inherit;cursor:pointer}
.stage{position:relative;width:100%;height:100svh;min-height:520px;overflow:hidden;isolation:isolate}
.top{position:absolute;top:clamp(22px,4vw,54px);left:clamp(22px,5.8vw,90px);right:clamp(22px,5.8vw,90px);z-index:3;display:flex;justify-content:space-between;align-items:start;gap:22px;font:400 13px/1.5 var(--mono)}
.top .dim{color:var(--grey);text-align:right}
.art{position:absolute;inset:0;display:block;width:100%;height:100%;touch-action:pan-y;cursor:grab}
.art:active{cursor:grabbing}
.center-label{position:absolute;left:50%;top:calc(50% + min(28vw,290px));transform:translateX(-50%);z-index:2;pointer-events:none;white-space:nowrap;text-align:center;font:400 clamp(10px,.92vw,13px)/1.5 var(--mono);color:#777}
.center-label strong{font-weight:500;color:var(--ink)}
.bottom{position:absolute;bottom:clamp(22px,4vw,54px);left:clamp(22px,5.8vw,90px);right:clamp(22px,5.8vw,90px);z-index:3;display:flex;align-items:end;justify-content:space-between;gap:22px;font:400 12px/1.5 var(--mono)}
.bottom .note{color:#777}
.bottom .note strong{font-weight:500;color:var(--ink)}
.controls{display:flex;align-items:center;gap:20px;flex-wrap:wrap;justify-content:flex-end}
.controls button{padding:5px 0;white-space:nowrap}
.controls button:hover{text-decoration:underline;text-underline-offset:5px}
.controls button[aria-pressed=true]{font-weight:600}
.corner{position:absolute;left:50%;top:50%;width:1px;height:1px;pointer-events:none;opacity:0}
@media(max-width:600px){
 .top{font-size:11px}
 .top .dim{font-size:10px}
 .bottom{font-size:10px;align-items:end}
 .controls{gap:10px}
 .center-label{top:calc(50% + min(42vw,200px));font-size:10px}
}
@media(prefers-reduced-motion:reduce){.art{cursor:default}}
</style>
</head>
<body>
<main class="stage" aria-label="Geist Monoの文字で構成された3Dフォルダが回転するアニメーション">
  <header class="top">
    <a href="../">~/portfolio</a>
    <span class="dim">EXPERIMENT 003 / ASCII FOLDER</span>
  </header>
  <canvas class="art" id="art" aria-label="文字で描かれたフォルダが立体的に回転するアニメーション。ドラッグで向きを変更できます。" role="img"></canvas>
  <div class="center-label"><strong>folder/</strong> &nbsp; — &nbsp; 3D ASCII OBJECT</div>
  <footer class="bottom">
    <div class="note"><strong>&gt; orbit_</strong><br>drag to rotate / 自動回転</div>
    <div class="controls">
      <button id="pause" type="button" aria-pressed="false">Ⅱ pause</button>
      <button id="speed" type="button" aria-label="回転速度を変更">speed ×1</button>
      <button id="reset" type="button">↻ reset</button>
    </div>
  </footer>
</main>
<script>
(()=>{
'use strict';
const canvas=document.getElementById('art');
const ctx=canvas.getContext('2d',{alpha:false});
const pauseButton=document.getElementById('pause');
const speedButton=document.getElementById('speed');
const resetButton=document.getElementById('reset');
const reduced=window.matchMedia('(prefers-reduced-motion: reduce)');
const points=[];
let W=0,H=0,DPR=1,unit=110,angle=.55,tilt=-.12;
let playing=!reduced.matches,speed=1,last=0,frame=0,dragging=false,previousX=0,previousY=0;
const TAU=Math.PI*2;
const rand=(n)=>{const v=Math.sin(n*127.1+13.7)*43758.5453;return v-Math.floor(v)};
const glyphs=['.','.',':','+','-','*','=','/','\\','o','0','#','%','@'];
// Faces are sampled into thousands of actual printable glyphs.
// x horizontal, y vertical (positive down), z depth.
function face(x0,x1,y0,y1,z,normal,step,seed){
  let i=0;
  for(let y=y0;y<=y1+.001;y+=step){
    for(let x=x0;x<=x1+.001;x+=step){
      const jitter=(rand(seed+i*7)-.5)*step*.16;
      add(x+jitter,y,z,normal,seed+i++,false);
    }
  }
}
function edge(a,b,seed,spacing=.063){
  const dist=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]);
  const n=Math.ceil(dist/spacing);
  for(let i=0;i<=n;i++){
    const t=i/n;
    add(a[0]+(b[0]-a[0])*t,a[1]+(b[1]-a[1])*t,a[2]+(b[2]-a[2])*t,[0,0,1],seed+i,true);
  }
}
function add(x,y,z,normal,seed,border){
  const r=rand(seed*3+5);
  const index=border?11+Math.floor(r*3):Math.floor(r*glyphs.length);
  points.push({x,y,z,nx:normal[0],ny:normal[1],nz:normal[2],char:glyphs[index],shade:rand(seed+91),border});
}
function geometry(){
  points.length=0;
  const step=W<560?.145:.103;
  // Rear folder sheet and its projecting tab.
  face(-2.15,2.15,-1.13,1.20,-.30,[0,0,-1],step,200);
  face(-2.15,-.67,-1.61,-1.12,-.30,[0,0,-1],step,5000);
  // The same back sheet, viewed from inside the open pocket.
  face(-2.15,2.15,-1.13,1.20,-.18,[0,0,1],step,12000);
  face(-2.15,-.67,-1.61,-1.12,-.18,[0,0,1],step,15000);
  // The main front flap is shorter than the rear tab: folder silhouette.
  face(-2.15,2.15,-.94,1.20,.27,[0,0,1],step,22000);
  // Small raised sidewalls give a readable volume at quarter-turn.
  for(let z=-.30;z<=.271;z+=step){
    for(let y=-.94;y<=1.20;y+=step){
      add(-2.15,y,z,[-1,0,0],33000+Math.floor((z+1)*1000+y*30),false);
      add(2.15,y,z,[1,0,0],37000+Math.floor((z+1)*1000+y*30),false);
    }
    for(let x=-2.15;x<=2.15;x+=step){
      add(x,1.20,z,[0,1,0],41000+Math.floor((z+1)*1000+x*30),false);
    }
  }
  // Edges: strong punctuation lines that preserve the folder silhouette.
  const back=[[-2.15,1.2,-.3],[2.15,1.2,-.3],[2.15,-1.13,-.3],[-.67,-1.13,-.3],[-.67,-1.61,-.3],[-2.15,-1.61,-.3],[-2.15,1.2,-.3]];
  for(let i=0;i<back.length-1;i++)edge(back[i],back[i+1],50000+i*100);
  const front=[[-2.15,-.94,.27],[2.15,-.94,.27],[2.15,1.2,.27],[-2.15,1.2,.27],[-2.15,-.94,.27]];
  for(let i=0;i<front.length-1;i++)edge(front[i],front[i+1],51000+i*100);
  for(const [x,y] of [[-2.15,-.94],[2.15,-.94],[-2.15,1.2],[2.15,1.2]])edge([x,y,-.3],[x,y,.27],53000+x*20+y*100);
}
function resize(){
  const rect=canvas.getBoundingClientRect();
  W=rect.width;H=rect.height;
  DPR=Math.min(window.devicePixelRatio||1,2);
  canvas.width=Math.round(W*DPR);canvas.height=Math.round(H*DPR);
  ctx.setTransform(DPR,0,0,DPR,0,0);
  unit=Math.min(W*.155,H*.215,155);
  geometry();render();
}
function render(){
  if(!W||!H)return;
  ctx.fillStyle='#f4f4f4';ctx.fillRect(0,0,W,H);
  const cy=Math.cos(angle),sy=Math.sin(angle),cx=Math.cos(tilt),sx=Math.sin(tilt);
  const visible=[];
  const camera=8.5;
  const size=Math.max(5,unit*(W<560?.11:.078));
  ctx.font='400 '+size.toFixed(2)+'px "Geist Mono",monospace';
  ctx.textAlign='center';ctx.textBaseline='middle';
  const originX=W*.5,originY=H*.50;
  for(let i=0;i<points.length;i++){
    const p=points[i];
    const rx=p.x*cy+p.z*sy;
    const rz=-p.x*sy+p.z*cy;
    const ry=p.y*cx-rz*sx;
    const dz=p.y*sx+rz*cx;
    const perspective=camera/(camera-dz);
    const px=originX+rx*unit*perspective;
    const py=originY+ry*unit*perspective;
    if(px<0||px>W||py<0||py>H)continue;
    const nz=-p.nx*sy+p.nz*cy;
    const ny=p.ny*cx-nz*sx;
    const facing=nz*cx+p.ny*sx;
    const light=.50+.30*Math.max(0,p.nx*.36+p.ny*(-.55)+p.nz*.74)*Math.cos(angle)*Math.cos(tilt);
    const alpha=p.border?.82:(.20+.50*p.shade+.18*Math.max(0,facing))*(.72+.25*light);
    visible.push({px,py,dz,char:p.char,alpha:Math.min(.9,alpha)});
  }
  visible.sort((a,b)=>a.dz-b.dz);
  for(let i=0;i<visible.length;i++){
    const p=visible[i];
    ctx.fillStyle='rgba(20,20,20,'+p.alpha.toFixed(3)+')';
    ctx.fillText(p.char,p.px,p.py);
  }
}
function tick(time){
  if(!last)last=time;
  const dt=Math.min(.055,(time-last)/1000);last=time;
  if(playing&&!dragging){
    angle=(angle+dt*.60*speed)%TAU;
    tilt=-.11+Math.sin(time*.00033)*.09;
  }
  render();
  frame=requestAnimationFrame(tick);
}
function syncButtons(){
  pauseButton.textContent=playing?'Ⅱ pause':'▶ play';
  pauseButton.setAttribute('aria-pressed',String(!playing));
  speedButton.textContent='speed ×'+speed;
}
pauseButton.addEventListener('click',()=>{playing=!playing;syncButtons()});
speedButton.addEventListener('click',()=>{speed=speed===1?2:speed===2?.5:1;syncButtons()});
resetButton.addEventListener('click',()=>{angle=.55;tilt=-.12;playing=!reduced.matches;speed=1;syncButtons();render()});
canvas.addEventListener('pointerdown',e=>{
  dragging=true;previousX=e.clientX;previousY=e.clientY;
  canvas.setPointerCapture(e.pointerId);
});
canvas.addEventListener('pointermove',e=>{
  if(!dragging)return;
  angle+=(e.clientX-previousX)*.008;
  tilt=Math.max(-.72,Math.min(.72,tilt+(e.clientY-previousY)*.006));
  previousX=e.clientX;previousY=e.clientY;
  render();
});
function stopDrag(){dragging=false}
canvas.addEventListener('pointerup',stopDrag);
canvas.addEventListener('pointercancel',stopDrag);
reduced.addEventListener?.('change',e=>{playing=!e.matches;syncButtons()});
window.addEventListener('resize',resize,{passive:true});
document.addEventListener('visibilitychange',()=>{last=0});
resize();syncButtons();
if(document.fonts?.ready)document.fonts.ready.then(render);
frame=requestAnimationFrame(tick);
})();
</script>
</body>
</html>
