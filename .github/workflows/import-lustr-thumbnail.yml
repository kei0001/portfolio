name: Import LUSTR thumbnail asset
on:
  push:
    paths:
      - .github/workflows/import-lustr-thumbnail.yml
permissions:
  contents: write
jobs:
  import-thumbnail:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch original uploaded LUSTR image
        env:
          ASSET_URL: "https://at.adobe.com/1qHKQT8A1ghdooA4"
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-delay 2 "$ASSET_URL" --output assets/lustr-y2k-thumbnail.png
          python3 - <<'PY'
          from pathlib import Path
          import struct
          p = Path("assets/lustr-y2k-thumbnail.png")
          data = p.read_bytes()
          if not data.startswith(b"\x89PNG\r\n\x1a\n"):
              raise ValueError("Downloaded asset is not a PNG image: "+repr(data[:120]))
          w, h = struct.unpack(">II", data[16:24])
          assert w == 2048 and h == 1198, (w,h)
          assert len(data) > 100_000, len(data)
          print("Valid LUSTR original:",w,h,len(data),"bytes")
          PY
      - name: Commit image asset
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/lustr-y2k-thumbnail.png
          git commit -m 'Add LUSTR Y2K supplied thumbnail'
          git push
