name: Capture torabo-tsuki Keymapper screenshot

on:
  push:
    paths:
      - .github/workflows/capture-torabo-screenshot.yml

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install screenshot browser
        run: |
          npm install --no-save --no-package-lock playwright@1.64.1
          npx playwright install --with-deps chromium
      - name: Capture the published Keymapper application
        run: |
          node <<'NODE'
          const {chromium}=require('playwright');
          (async () => {
            const browser=await chromium.launch({headless:true});
            const page=await browser.newPage({viewport:{width:1440,height:820},deviceScaleFactor:1.5,colorScheme:'light',locale:'ja-JP'});
            await page.goto('https://kei0001.github.io/torabo-tsuki_keymapper/',{waitUntil:'networkidle',timeout:60000});
            await page.locator('#board .key').first().waitFor({timeout:25000});
            await page.locator('#board .key').nth(12).click();
            await page.waitForTimeout(700);
            const keyCount=await page.locator('#board .key').count();
            const positions=await page.locator('#board .key').evaluateAll(keys=>keys.slice(0,5).map(k=>({left:k.style.left,top:k.style.top})));
            if(keyCount<35)throw new Error('Keyboard did not render: '+keyCount);
            if(new Set(positions.map(x=>x.top)).size<2)throw new Error('Expected physical column staggering');
            await page.screenshot({path:'assets/torabo-keymapper-screenshot.png',animations:'disabled'});
            // Separate real-app capture for the key-position design decision.
            // Position numbers are already visible in the current UI.
            await page.waitForTimeout(300);
            await page.locator('#boardwrap').screenshot({path:'assets/torabo-keymapper-positions.png',animations:'disabled'});
            console.log('Captured live UI with',keyCount,'keys, positions',JSON.stringify(positions));
            await browser.close();
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE
      - name: Commit screenshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/torabo-keymapper-screenshot.png assets/torabo-keymapper-positions.png
          git commit -m 'Capture real torabo-tsuki Keymapper interface'
          git push
