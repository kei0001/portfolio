name: Import Sakito motion asset
on:
  push:
    paths:
      - .github/workflows/import-sakito-motion.yml
permissions:
  contents: write
jobs:
  import-video:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Download and optimize Sakito video
        env:
          VIDEO_SOURCE: https://at.adobe.com/qJGvmyNuqOGpQHUn
        run: |
          set -euo pipefail
          mkdir -p assets
          curl -fLsS --retry 3 --max-time 150 "$VIDEO_SOURCE" -o /tmp/sakito-original.mp4
          file /tmp/sakito-original.mp4
          test "$(stat -c%s /tmp/sakito-original.mp4)" -gt 100000
          sudo apt-get -qq update
          sudo apt-get -qq install -y ffmpeg
          ffmpeg -hide_banner -loglevel error -y -i /tmp/sakito-original.mp4 -vf "scale=720:-2:flags=lanczos" -c:v libx264 -preset medium -crf 23 -maxrate 2800k -bufsize 5600k -pix_fmt yuv420p -movflags +faststart -c:a aac -b:a 128k assets/sakito-osaka-guest.mp4
          test "$(stat -c%s assets/sakito-osaka-guest.mp4)" -gt 100000
          ffprobe -hide_banner -v error -show_entries format=duration,size -of default=noprint_wrappers=1 assets/sakito-osaka-guest.mp4
      - name: Commit finished video and remove one-time importer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/sakito-osaka-guest.mp4
          git rm .github/workflows/import-sakito-motion.yml
          git commit -m "Publish Sakito Osaka guest motion video"
          git pull --rebase origin main
          git push origin HEAD:main
