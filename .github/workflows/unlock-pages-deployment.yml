name: Retire stale Pages environment deployment
on:
  push:
    paths:
      - .github/workflows/unlock-pages-deployment.yml
permissions:
  contents: read
  deployments: write
  pages: read
jobs:
  unlock:
    runs-on: ubuntu-latest
    steps:
      - name: Mark specific old successful environment deployment inactive
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ID=7470493100
          OLD_SHA=d2f170cc0eaca6e079569e158086f6555b6457d1
          echo "Checking recorded environment deployment $ID"
          DEPLOYMENT=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$ID")
          SHA=$(echo "$DEPLOYMENT" | jq -r .sha)
          ENV=$(echo "$DEPLOYMENT" | jq -r .environment)
          if [ "$SHA" != "$OLD_SHA" ] || [ "$ENV" != github-pages ]; then
            echo "Deployment mismatch; no action taken" && exit 1
          fi
          echo "Recent statuses:"
          gh api "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses?per_page=10" --jq '.[] | {id,state,created_at,description}'
          echo "Marking this old deployment inactive; site files remain intact"
          gh api --method POST "repos/$GITHUB_REPOSITORY/deployments/$ID/statuses" \
            -f state=inactive \
            -f description='Superseded by a newer portfolio deploy' \
            -f auto_inactive=false --jq '{id,state,description}'
