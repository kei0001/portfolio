name: Diagnose stuck GitHub Pages deployment
on:
  push:
    paths:
      - .github/workflows/pages-deployment-check.yml
permissions:
  contents: read
  pages: write
jobs:
  verify-deployment:
    runs-on: ubuntu-latest
    steps:
      - name: Check and unlock old Pages deployment if still running
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OLD_SHA=d2f170cc0eaca6e079569e158086f6555b6457d1
          echo "Checking old deployment state for $OLD_SHA"
          if ! STATUS=$(gh api "repos/$GITHUB_REPOSITORY/pages/deployments/$OLD_SHA" --jq '.status'); then
            echo "Could not retrieve deployment state; no cancellation performed"
            exit 0
          fi
          echo "Old deployment status: $STATUS"
          if [ "$STATUS" = "in_progress" ] || [ "$STATUS" = "pending" ] || [ "$STATUS" = "queued" ]; then
            echo "Cancelling the blocking old in-progress Pages deployment"
            gh api --method POST "repos/$GITHUB_REPOSITORY/pages/deployments/$OLD_SHA/cancel"
          else
            echo "No cancellation required; old deployment already finalized"
          fi
