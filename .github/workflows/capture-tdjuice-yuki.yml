name: Capture Yuki website preview
on:
  push:
    paths:
      - .github/workflows/capture-tdjuice-yuki.yml
permissions:
  contents: write
jobs:
  screenshot:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - name: Capture live site
        run: |
          set -euo pipefail
          command -v google-chrome || command -v chromium || command -v chromium-browser
          curl -fLsS --retry 2 --max-time 35 -A 'Mozilla/5.0' https://tdjuice.club/yuki/ -o /tmp/tdjuice.html
          test "$(stat -c%s /tmp/tdjuice.html)" -gt 1000
          timeout 45 google-chrome --headless --disable-gpu --no-sandbox --disable-dev-shm-usage --hide-scrollbars --virtual-time-budget=6000 --window-size=1440,900 --screenshot=/tmp/tdjuice-yuki.png https://tdjuice.club/yuki/
          file /tmp/tdjuice-yuki.png
          ffmpeg -hide_banner -loglevel error -y -i /tmp/tdjuice-yuki.png -vf 'scale=1100:-2' -q:v 4 assets/tdjuice-yuki-preview.jpg
          test "$(stat -c%s assets/tdjuice-yuki-preview.jpg)" -gt 20000
      - name: Save image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tdjuice-yuki-preview.jpg
          git commit -m "Capture TOP DANDY JUICE Yuki website thumbnail" || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
